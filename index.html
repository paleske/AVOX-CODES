<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOX CODE POS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VOX CODE">
<link rel="apple-touch-icon" href="icon-192.jpg">
<link rel="icon" href="icon-192.jpg">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f3f4f6;color:#172033;overflow:hidden}
button{cursor:pointer}
.hidden{display:none!important}
.login-screen{height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#111827,#2563eb);padding:20px}
.login-box{width:100%;max-width:420px;background:#fff;padding:30px;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.logo{text-align:center;font-size:34px;font-weight:900;color:#2563eb}
.logo-sub{text-align:center;color:#777;margin:5px 0 25px}
.login-tabs{display:flex;gap:8px;margin-bottom:20px}
.login-tabs button{flex:1;padding:12px;border:0;border-radius:8px;background:#e5e7eb}
.login-tabs .active{background:#2563eb;color:#fff}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;outline:none}
input:focus,select:focus{border-color:#2563eb}
.primary-btn{width:100%;padding:13px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:bold;margin-top:16px}
.message{text-align:center;font-size:14px;margin-top:10px}
.topbar{height:65px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{font-size:23px;font-weight:900}
.user-area{display:flex;align-items:center;gap:10px}
.logout{background:#dc2626;color:#fff;border:0;padding:9px 13px;border-radius:7px}
.admin-layout{display:flex;height:calc(100vh - 65px)}
.sidebar{width:210px;background:#1f2937;padding:12px}
.sidebar button{width:100%;padding:12px;margin-bottom:7px;border:0;background:transparent;color:#fff;text-align:left;border-radius:6px}
.sidebar button.active,.sidebar button:hover{background:#2563eb}
.admin-content{flex:1;overflow:auto;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.card{background:#fff;padding:18px;border-radius:10px}
.card-title{color:#777;font-size:13px}
.card-value{font-size:26px;font-weight:bold;margin-top:6px}
.section{background:#fff;padding:18px;border-radius:10px;margin-bottom:15px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}
th{background:#f3f4f6}
.small-btn{border:0;padding:6px 9px;border-radius:5px;background:#2563eb;color:#fff}
.delete-btn{background:#dc2626}
.employee-main{height:calc(100vh - 65px);padding:12px;overflow:hidden}
.pos-layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:12px;height:calc(100vh - 105px)}
.products-area{min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;padding-right:5px}
.pos-top{position:sticky;top:0;z-index:50;background:#f3f4f6;padding-bottom:8px}
.scanner-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}
.scanner-input{height:40px}
.scan-btn{height:40px;border:0;border-radius:7px;background:#111827;color:#fff;padding:0 14px;font-weight:bold}
.pos-controls{display:grid;grid-template-columns:minmax(120px,1fr) 125px;gap:8px}
.search-box input{height:40px}
.top-complete-btn{height:40px;border:0;border-radius:7px;background:#16a34a;color:#fff;font-weight:bold;font-size:12px}
.categories{display:flex;gap:7px;overflow-x:auto;padding:8px 0}
.category-btn{white-space:nowrap;border:0;padding:7px 12px;border-radius:18px;background:#e5e7eb;font-size:12px}
.category-btn.active{background:#2563eb;color:#fff}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.product-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px}
.product-name{font-weight:bold;min-height:36px;font-size:14px}
.product-category{color:#777;font-size:11px;margin:5px 0}
.product-price{color:#16a34a;font-size:17px;font-weight:bold}
.product-barcode{color:#888;font-size:10px;margin-top:3px}
.stock{color:#777;font-size:11px;margin-top:4px}
.add-product{width:100%;border:0;background:#2563eb;color:#fff;padding:8px;border-radius:6px;margin-top:8px;font-size:11px;font-weight:bold}
.add-product:disabled{background:#999}
.cart-panel{height:100%;background:#fff;border-radius:11px;padding:15px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cart-heading{display:flex;justify-content:space-between;align-items:center}
.cart-list{flex:1;min-height:0;overflow-y:auto;margin-top:8px}
.empty-cart{text-align:center;color:#777;padding:30px 5px}
.cart-item{padding:10px 0;border-bottom:1px solid #eee}
.cart-item-top{display:flex;justify-content:space-between;gap:5px;font-size:13px;font-weight:bold}
.qty-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.qty-btn{width:27px;height:27px;border:0;border-radius:5px;background:#e5e7eb}
.remove-btn{margin-left:auto;border:0;background:#fee2e2;color:#dc2626;padding:6px 8px;border-radius:5px;font-size:11px}
.sale-bottom{flex-shrink:0;border-top:2px solid #eee;padding-top:10px}
.total-row{display:flex;justify-content:space-between;font-size:21px;font-weight:bold;margin-bottom:10px}
.payment-title{font-weight:bold;font-size:13px;margin-bottom:6px}
.payment-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.payment-method{padding:9px 3px;border:1px solid #d1d5db;background:#fff;border-radius:6px;font-size:11px}
.payment-method.active{background:#2563eb;color:#fff}
.payment-extra{margin-top:7px}
.payment-extra input{padding:9px;font-size:12px}
.bottom-complete{width:100%;padding:12px;border:0;border-radius:7px;background:#16a34a;color:#fff;font-weight:bold;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:center;padding:15px;z-index:100}
.receipt{background:#fff;width:100%;max-width:390px;max-height:90vh;overflow:auto;border-radius:10px;padding:22px}
.receipt-header{text-align:center;margin-bottom:15px}
.store-name{font-size:24px;font-weight:900;margin-bottom:5px}
.vox-name{font-size:11px;color:#777;margin-bottom:10px}
.receipt-line{display:flex;justify-content:space-between;padding:6px 0;gap:10px}
.receipt-total{border-top:2px solid #111;margin-top:8px;padding-top:8px;font-weight:bold}
.receipt-buttons{display:flex;gap:8px;margin-top:15px}
.receipt-buttons button{flex:1;padding:11px;border:0;border-radius:6px}
.close-receipt{background:#e5e7eb}
.print-receipt{background:#2563eb;color:#fff}
@media(max-width:800px){.pos-layout{grid-template-columns:1fr;height:calc(100vh - 105px)}.products-area{height:52vh}.cart-panel{height:42vh}.product-grid{grid-template-columns:repeat(2,1fr)}.sidebar{width:170px}}
@media(max-width:500px){.brand{font-size:18px}.sidebar{width:145px}.sidebar button{font-size:12px}.product-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<!-- LOGIN, ADMIN, POS CODE YAKO YOTE HAPA - SIJABADILISHA -->
<!-- ... (endelea na code yako yote kama ulivyo-tuma) ... -->
<!-- KWA UFUPI NIMEWEKA MANIFEST LINK HAPO JUU TU -->

<script>
function getData(k,f){try{let d=localStorage.getItem(k);return d?JSON.parse(d):f}catch(e){return f}}function saveData(k,d){localStorage.setItem(k,JSON.stringify(d))}
if(!localStorage.getItem("voxStoreName"))localStorage.setItem("voxStoreName","MY STORE");
function initializeProducts(){if(localStorage.getItem("voxProducts"))return;let p=[{id:1,name:"Milk 500ml",barcode:"616110001001",category:"Dairy",price:70,stock:100},{id:2,name:"Milk 1L",barcode:"616110001002",category:"Dairy",price:120,stock:100},{id:3,name:"Bread 400g",barcode:"616110001003",category:"Bakery",price:65,stock:100},{id:4,name:"Sugar 1kg",barcode:"616110001004",category:"Groceries",price:160,stock:100},{id:5,name:"Rice 1kg",barcode:"616110001005",category:"Groceries",price:180,stock:100},{id:6,name:"Cooking Oil 1L",barcode:"616110001006",category:"Groceries",price:250,stock:100},{id:7,name:"Water 500ml",barcode:"616110001007",category:"Beverages",price:50,stock:100},{id:8,name:"Juice 1L",barcode:"616110001008",category:"Beverages",price:180,stock:100},{id:9,name:"Biscuits",barcode:"616110001009",category:"Snacks",price:80,stock:100},{id:10,name:"Soap",barcode:"616110001010",category:"Personal Care",price:100,stock:100}];saveData("voxProducts",p)}initializeProducts();
function switchLogin(t){document.getElementById("adminTab").classList.toggle("active",t==="admin");document.getElementById("employeeTab").classList.toggle("active",t==="employee");document.getElementById("adminLogin").classList.toggle("hidden",t!=="admin");document.getElementById("employeeLogin").classList.toggle("hidden",t!=="employee");document.getElementById("adminSignup").classList.add("hidden")}
function showSignup(){document.getElementById("adminLogin").classList.add("hidden");document.getElementById("adminSignup").classList.remove("hidden")}
function showLogin(){document.getElementById("adminSignup").classList.add("hidden");document.getElementById("adminLogin").classList.remove("hidden")}
function createAdmin(){let n=document.getElementById("adminName").value.trim(),e=document.getElementById("signupEmail").value.trim(),p=document.getElementById("signupPassword").value,p2=document.getElementById("signupPassword2").value,m=document.getElementById("signupMessage");if(!n||!e||!p){m.textContent="Fill all fields.";m.style.color="red";return}if(p!==p2){m.textContent="Passwords do not match.";m.style.color="red";return}saveData("voxAdmin",{name:n,email:e,password:p});m.textContent="Admin account created.";m.style.color="green";setTimeout(showLogin,700)}
function adminLogin(){let e=document.getElementById("adminEmail").value.trim(),p=document.getElementById("adminPassword").value,a=getData("voxAdmin",null),m=document.getElementById("adminMessage");if(!a){m.textContent="Create the admin account first.";m.style.color="red";return}if(e===a.email&&p===a.password){sessionStorage.setItem("voxSession",JSON.stringify({role:"admin"}));openAdmin()}else{m.textContent="Incorrect email or password.";m.style.color="red"}}
function addEmployee(){let n=document.getElementById("employeeName").value.trim(),u=document.getElementById("newUsername").value.trim(),p=document.getElementById("newPassword").value,m=document.getElementById("employeeCreateMessage");if(!n||!u||!p){m.textContent="Fill all fields.";m.style.color="red";return}let em=getData("voxEmployees",[]);if(em.some(e=>e.username===u)){m.textContent="Username already exists.";m.style.color="red";return}em.push({id:Date.now(),name:n,username:u,password:p});saveData("voxEmployees",em);document.getElementById("employeeName").value="";document.getElementById("newUsername").value="";document.getElementById("newPassword").value="";m.textContent="Employee created successfully.";m.style.color="green";updateAdmin()}
function employeeLogin(){let u=document.getElementById("employeeUsername").value.trim(),p=document.getElementById("employeePassword").value,em=getData("voxEmployees",[]),e=em.find(e=>e.username===u&&e.password===p),m=document.getElementById("employeeMessage");if(!e){m.textContent="Incorrect username or password.";m.style.color="red";return}sessionStorage.setItem("voxSession",JSON.stringify({role:"employee",employeeId:e.id}));openEmployee()}
function openAdmin(){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("employeeDashboard").classList.add("hidden");document.getElementById("adminDashboard").classList.remove("hidden");let a=getData("voxAdmin",{name:"Admin"});document.getElementById("adminUser").textContent=a.name;document.getElementById("storeNameInput").value=localStorage.getItem("voxStoreName")||"MY STORE";updateAdmin()}
function openEmployee(){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("adminDashboard").classList.add("hidden");document.getElementById("employeeDashboard").classList.remove("hidden");let s=JSON.parse(sessionStorage.getItem("voxSession")),em=getData("voxEmployees",[]),e=em.find(x=>x.id===s.employeeId);document.getElementById("employeeUser").textContent=e?e.name:"Employee";cart=[];selectedPayment="Cash";selectedCategory="All";renderCategories();renderPOSProducts();renderCart();setTimeout(focusBarcode,300)}
function saveStoreSettings(){let i=document.getElementById("storeNameInput"),n=i.value.trim(),m=document.getElementById("storeMessage");if(!n){m.textContent="Enter a store name.";m.style.color="red";return}localStorage.setItem("voxStoreName",n);m.textContent="Store name saved successfully.";m.style.color="green"}
function adminPage(p,b){document.querySelectorAll(".admin-content > div").forEach(x=>x.classList.add("hidden"));document.getElementById(p+"Page").classList.remove("hidden");document.querySelectorAll(".sidebar button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(p==="settings")document.getElementById("storeNameInput").value=localStorage.getItem("voxStoreName")||"MY STORE"}
function updateAdmin(){let em=getData("voxEmployees",[]),pr=getData("voxProducts",[]),sa=getData("voxSales",[]),rev=sa.reduce((s,x)=>s+x.total,0);document.getElementById("employeeCount").textContent=em.length;document.getElementById("productCount").textContent=pr.length;document.getElementById("saleCount").textContent=sa.length;document.getElementById("revenue").textContent="KSh "+rev.toLocaleString();document.getElementById("reportTransactions").textContent=sa.length;document.getElementById("reportRevenue").textContent="KSh "+rev.toLocaleString();renderEmployees();renderProductsAdmin();renderSales();renderRecentSales();renderReports()}
function employeeName(id){let em=getData("voxEmployees",[]),e=em.find(x=>x.id===id);return e?e.name:"Unknown"}
function renderEmployees(){let em=getData("voxEmployees",[]),sa=getData("voxSales",[]),t=document.getElementById("employeesTable");t.innerHTML="";em.forEach(e=>{let m=sa.filter(s=>s.employeeId===e.id);t.innerHTML+=`<tr><td>${safe(e.name)}</td><td>${safe(e.username)}</td><td>${m.length}</td><td><button class="small-btn delete-btn" onclick="deleteEmployee(${e.id})">Delete</button></td></tr>`})}
function deleteEmployee(id){if(!confirm("Delete employee?"))return;let em=getData("voxEmployees",[]);em=em.filter(e=>e.id!==id);saveData("voxEmployees",em);updateAdmin()}
function addProduct(){let n=document.getElementById("newProductName").value.trim(),b=document.getElementById("newProductBarcode").value.trim(),c=document.getElementById("newProductCategory").value.trim(),p=Number(document.getElementById("newProductPrice").value),s=Number(document.getElementById("newProductStock").value);if(!n||!b||!c||p<=0||s<0){alert("Enter valid product details.");return}let pr=getData("voxProducts",[]);if(pr.some(x=>x.barcode===b)){alert("That barcode already exists.");return}pr.push({id:Date.now(),name:n,barcode:b,category:c,price:p,stock:s});saveData("voxProducts",pr);document.getElementById("newProductName").value="";document.getElementById("newProductBarcode").value="";document.getElementById("newProductCategory").value="";document.getElementById("newProductPrice").value="";document.getElementById("newProductStock").value="";updateAdmin();renderCategories();renderPOSProducts()}
function renderProductsAdmin(){let pr=getData("voxProducts",[]),t=document.getElementById("productsTable");t.innerHTML="";pr.forEach(p=>{t.innerHTML+=`<tr><td>${safe(p.name)}</td><td>${safe(p.barcode||"-")}</td><td>${safe(p.category)}</td><td>KSh ${p.price.toLocaleString()}</td><td>${p.stock}</td></tr>`})}
function renderSales(){let sa=getData("voxSales",[]),t=document.getElementById("salesTable");t.innerHTML="";sa.slice().reverse().forEach(s=>{t.innerHTML+=`<tr><td>${safe(s.receipt)}</td><td>${safe(employeeName(s.employeeId))}</td><td>${safe(s.payment)}</td><td>KSh ${s.total.toLocaleString()}</td><td>${safe(s.date)}</td></tr>`})}
function renderRecentSales(){let sa=getData("voxSales",[]),t=document.getElementById("recentSales");t.innerHTML="";sa.slice(-10).reverse().forEach(s=>{t.innerHTML+=`<tr><td>${safe(employeeName(s.employeeId))}</td><td>${safe(s.payment)}</td><td>KSh ${s.total.toLocaleString()}</td><td>${safe(s.date)}</td></tr>`})}
function renderReports(){let em=getData("voxEmployees",[]),sa=getData("voxSales",[]),t=document.getElementById("reportTable");t.innerHTML="";em.forEach(e=>{let m=sa.filter(s=>s.employeeId===e.id),r=m.reduce((s,x)=>s+x.total,0);t.innerHTML+=`<tr><td>${safe(e.name)}</td><td>${m.length}</td><td>KSh ${r.toLocaleString()}</td></tr>`})}
let cart=[],selectedPayment="Cash",selectedCategory="All";
function renderCategories(){let pr=getData("voxProducts",[]),cats=["All",...new Set(pr.map(p=>p.category))],b=document.getElementById("categories");b.innerHTML="";cats.forEach(c=>{let btn=document.createElement("button");btn.className="category-btn"+(c===selectedCategory?" active":"");btn.textContent=c;btn.onclick=()=>{selectedCategory=c;renderCategories();renderPOSProducts()};b.appendChild(btn)})}
function renderPOSProducts(){let pr=getData("voxProducts",[]),s=document.getElementById("searchInput")?document.getElementById("searchInput").value.toLowerCase().trim():"",box=document.getElementById("posProducts");box.innerHTML="";let f=pr.filter(p=>((p.name.toLowerCase().includes(s)||String(p.barcode||"").includes(s))&&(selectedCategory==="All"||p.category===selectedCategory)));f.forEach(p=>{let card=document.createElement("div");card.className="product-card";card.innerHTML=`<div class="product-name">${safe(p.name)}</div><div class="product-category">${safe(p.category)}</div><div class="product-price">KSh ${p.price.toLocaleString()}</div><div class="product-barcode">Barcode: ${safe(p.barcode||"-")}</div><div class="stock">Stock: ${p.stock}</div>`;let btn=document.createElement("button");btn.className="add-product";btn.textContent=p.stock>0?"ADD TO CART":"OUT OF STOCK";btn.disabled=p.stock<=0;btn.onclick=()=>addToCart(p.id);card.appendChild(btn);box.appendChild(card)})}
function focusBarcode(){let i=document.getElementById("barcodeInput");if(i)i.focus()}
document.addEventListener("DOMContentLoaded",function(){let b=document.getElementById("barcodeInput");if(b)b.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();scanBarcode()}})});
function scanBarcode(){let i=document.getElementById("barcodeInput"),b=i.value.trim();if(!b){i.focus();return}let pr=getData("voxProducts",[]),p=pr.find(x=>String(x.barcode)===String(b));if(!p){alert("Product not found for barcode: "+b);i.select();return}if(p.stock<=0){alert("This product is out of stock.");i.select();return}addToCart(p.id);i.value="";i.focus()}
function addToCart(id){let pr=getData("voxProducts",[]),p=pr.find(x=>x.id===id);if(!p||p.stock<=0)return;let ex=cart.find(x=>x.id===id);if(ex){if(ex.qty>=p.stock){alert("Maximum stock reached.");return}ex.qty++}else cart.push({id:p.id,name:p.name,price:p.price,qty:1});renderCart()}
function changeQuantity(id,a){let it=cart.find(x=>x.id===id),pr=getData("voxProducts",[]),p=pr.find(x=>x.id===id);if(!it||!p)return;it.qty+=a;if(it.qty<=0)cart=cart.filter(x=>x.id!==id);if(it.qty>p.stock)it.qty=p.stock;renderCart()}
function removeFromCart(id){cart=cart.filter(x=>x.id!==id);renderCart()}
function renderCart(){let box=document.getElementById("cartList");box.innerHTML="";if(cart.length===0){box.innerHTML=`<div class="empty-cart">Cart is empty</div>`;document.getElementById("total").textContent="KSh 0";document.getElementById("cartCount").textContent="0 items";return}let t=0,c=0;cart.forEach(it=>{let a=it.price*it.qty;t+=a;c+=it.qty;box.innerHTML+=`<div class="cart-item"><div class="cart-item-top"><span>${safe(it.name)}</span><span>KSh ${a.toLocaleString()}</span></div><div class="qty-row"><button class="qty-btn" onclick="changeQuantity(${it.id},-1)">-</button><strong>${it.qty}</strong><button class="qty-btn" onclick="changeQuantity(${it.id},1)">+</button><button class="remove-btn" onclick="removeFromCart(${it.id})">Remove</button></div></div>`});document.getElementById("total").textContent="KSh "+t.toLocaleString();document.getElementById("cartCount").textContent=c+(c===1?" item":" items")}
function selectPayment(m){selectedPayment=m;document.getElementById("cashBtn").classList.toggle("active",m==="Cash");document.getElementById("mpesaBtn").classList.toggle("active",m==="M-Pesa");document.getElementById("cardBtn").classList.toggle("active",m==="Card");let e=document.getElementById("paymentExtra");if(m==="M-Pesa")e.innerHTML=`<input id="mpesaReference" placeholder="Enter M-Pesa code">`;else if(m==="Card")e.innerHTML=`<input id="cardReference" placeholder="Enter card reference">`;else e.innerHTML=""}
function completeSale(){if(cart.length===0){alert("Please add products to the cart first.");return}if(selectedPayment==="M-Pesa"){let r=document.getElementById("mpesaReference");if(!r||!r.value.trim()){alert("Enter the M-Pesa code.");return}}if(selectedPayment==="Card"){let r=document.getElementById("cardReference");if(!r||!r.value.trim()){alert("Enter the card reference.");return}}let pr=getData("voxProducts",[]),total=0;for(let it of cart){let p=pr.find(x=>x.id===it.id);if(!p||p.stock<it.qty){alert("Not enough stock for "+it.name);return}total+=it.price*it.qty}let s=JSON.parse(sessionStorage.getItem("voxSession")),sale={receipt:"VC-"+Date.now(),employeeId:s.employeeId,items:cart.map(x=>({...x})),total,payment:selectedPayment,date:new Date().toLocaleString()};cart.forEach(it=>{let p=pr.find(x=>x.id===it.id);p.stock-=it.qty});saveData("voxProducts",pr);let sa=getData("voxSales",[]);sa.push(sale);saveData("voxSales",sa);showReceipt(sale);cart=[];renderCart();renderPOSProducts();updateAdmin()}
function showReceipt(sale){let store=localStorage.getItem("voxStoreName")||"MY STORE";document.getElementById("receiptStoreName").textContent=store;document.getElementById("receiptNo").textContent="Receipt: "+sale.receipt;document.getElementById("receiptDate").textContent=sale.date;let items=document.getElementById("receiptItems");items.innerHTML="";sale.items.forEach(it=>{items.innerHTML+=`<div class="receipt-line"><span>${safe(it.name)} x${it.qty}</span><span>KSh ${(it.price*it.qty).toLocaleString()}</span></div>`});document.getElementById("receiptAmount").textContent="KSh "+sale.total.toLocaleString();document.getElementById("receiptMethod").textContent=sale.payment;document.getElementById("receiptModal").classList.remove("hidden")}
function closeReceipt(){document.getElementById("receiptModal").classList.add("hidden")}
function printReceipt(){let store=localStorage.getItem("voxStoreName")||"MY STORE",no=document.getElementById("receiptNo").textContent,date=document.getElementById("receiptDate").textContent,items=document.getElementById("receiptItems").innerHTML,amt=document.getElementById("receiptAmount").textContent,pay=document.getElementById("receiptMethod").textContent,w=window.open("","_blank");if(!w){alert("Allow pop-ups");return}w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Receipt</title><style>@page{size:80mm auto;margin:0}*{box-sizing:border-box}body{width:80mm;margin:0;padding:5mm;font-family:Arial;color:#000;font-size:12px}.store{text-align:center;font-size:20px;font-weight:bold;margin-bottom:4px}.powered{text-align:center;font-size:9px;margin-bottom:10px}.center{text-align:center}hr{border:0;border-top:1px solid #000}.line{display:flex;justify-content:space-between;gap:8px;padding:4px 0}.total{border-top:1px solid #000;margin-top:8px;padding-top:8px;font-weight:bold}</style></head><body><div class="store">${safe(store)}</div><div class="powered">Powered by VOX CODE POS</div><hr><div class="center"><strong>SALES RECEIPT</strong><br>${safe(no)}<br>${safe(date)}</div><br>${items}<div class="total"><div class="line"><span>Total</span><span>${safe(amt)}</span></div><div class="line"><span>Payment</span><span>${safe(pay)}</span></div></div><br><div class="center">Thank you!</div><script>window.onload=function(){setTimeout(function(){window.print()},500)};<\/script></body></html>`);w.document.close()}
function testPrint(){let s=localStorage.getItem("voxStoreName")||"MY STORE",w=window.open("","_blank");if(!w){alert("Allow pop-ups");return}w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>@page{size:80mm auto;margin:0}body{width:80mm;padding:5mm;text-align:center;font-family:Arial}h2{margin-bottom:5px}</style></head><body><h2>${safe(s)}</h2><strong>PRINTER TEST</strong><p>VOX CODE POS</p><p>Printer is ready</p><script>window.onload=function(){setTimeout(function(){window.print()},500)};<\/script></body></html>`);w.document.close()}
function logout(){sessionStorage.removeItem("voxSession");cart=[];document.getElementById("adminDashboard").classList.add("hidden");document.getElementById("employeeDashboard").classList.add("hidden");document.getElementById("loginScreen").classList.remove("hidden")}
function safe(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
</script>
